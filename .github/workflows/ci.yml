name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pullbox-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Rust backend
    runs-on:
      - self-hosted
      - linux
      - gridops-ci
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --locked
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
