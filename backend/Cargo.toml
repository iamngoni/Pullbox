[package]
name = "pullbox-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-cors = "0.7"
actix-files = "0.6"
actix-web = "4.11"
anyhow = "1"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "fs"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
actix-rt = "2"
