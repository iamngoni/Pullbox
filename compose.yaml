services:
  pullbox:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pullbox:local
    container_name: pullbox
    env_file:
      - path: .env
        required: false
    environment:
      PULLBOX_BIND: 0.0.0.0:8787
      PULLBOX_APNS_TOKEN_STORE_PATH: /data/live-activity-tokens.json
      COOKIES_DIR: /cookies
      RUST_LOG: info
    volumes:
      - pullbox-data:/data
      - ./cookies:/cookies:ro
    ports:
      - "127.0.0.1:8787:8787"
    labels:
      - traefik.enable=true
      - traefik.http.routers.pullbox.rule=Host(`pullbox.antonlabs.cc`)
      - traefik.http.routers.pullbox.entrypoints=websecure
      - traefik.http.routers.pullbox.tls=true
      - traefik.http.services.pullbox.loadbalancer.server.port=8787
      - traefik.docker.network=media-server_default
    networks:
      - media-server
    restart: unless-stopped

networks:
  media-server:
    name: media-server_default
    external: true

volumes:
  pullbox-data:
