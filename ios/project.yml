name: Pullbox
options:
  bundleIdPrefix: dev.iamngoni
  deploymentTarget:
    iOS: "17.0"
packages:
  PullboxCore:
    path: PullboxCore
targets:
  Pullbox:
    type: application
    platform: iOS
    sources:
      - Pullbox
    dependencies:
      - package: PullboxCore
      - target: PullboxShareExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.iamngoni.pullbox
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: 4973Y692JU
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Pullbox
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Pullbox saves downloaded videos directly to your Photos library.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Pullbox connects to your private downloader backend on your local network.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSSupportsLiveActivities: true
        INFOPLIST_KEY_NSSupportsLiveActivitiesFrequentUpdates: true
        INFOPLIST_KEY_UIBackgroundModes: [fetch, remote-notification]
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_ENTITLEMENTS: Pullbox/Pullbox.entitlements
    entitlements:
      path: Pullbox/Pullbox.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.iamngoni.pullbox
    info:
      path: Pullbox/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSPhotoLibraryAddUsageDescription: Pullbox saves downloaded videos directly to your Photos library.
        NSLocalNetworkUsageDescription: Pullbox connects to your private downloader backend on your local network.
        NSSupportsLiveActivities: true
  PullboxShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - PullboxShareExtension
    dependencies:
      - package: PullboxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.iamngoni.pullbox.share
        PRODUCT_NAME: Pullbox Share
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: 4973Y692JU
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: true
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: PullboxShareExtension/PullboxShareExtension.entitlements
    entitlements:
      path: PullboxShareExtension/PullboxShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.iamngoni.pullbox
    info:
      path: PullboxShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Pullbox
        NSPhotoLibraryAddUsageDescription: Pullbox saves downloaded videos directly to your Photos library.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  PullboxLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - PullboxLiveActivity
    dependencies:
      - package: PullboxCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.iamngoni.pullbox.liveactivity
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: 4973Y692JU
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: true
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: PullboxLiveActivity/PullboxLiveActivity.entitlements
    entitlements:
      path: PullboxLiveActivity/PullboxLiveActivity.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.iamngoni.pullbox
    info:
      path: PullboxLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Pullbox Live Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
